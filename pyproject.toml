[project]
name = "steam-art-scraper"
version = "0.1.0"
description = "Download Steam app artwork (no videos)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.2",
]

[project.scripts]
steam-art-scraper = "steam_art_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.10.3,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
preset = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F401 unused imports, E3 blank lines, W291/W293 trailing whitespace, I import sorting.
select = ["E", "F", "W", "I"]
preview = true  # needed for E3xx blank-line rules
ignore = ["E501"]  # line length handled by ruff format

[tool.ruff.format]
line-ending = "lf"
