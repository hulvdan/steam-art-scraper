repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: empty-to-import
        name: _TO_IMPORT.txt has no entries
        # Файл коммитится только с комментариями; список игр — локальный.
        entry: '^\s*[^#\s]'
        language: pygrep
        files: ^_TO_IMPORT\.txt$
